<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; background:#1a1a2e; display:flex; gap:40px; padding:40px; align-items:center; justify-content:center; min-height:100vh; flex-wrap:wrap; }
  .card { background:#fff; border-radius:16px; padding:20px; text-align:center; }
  .card h3 { margin:0 0 10px; color:#333; font-family:sans-serif; font-size:14px; }
  .card img, .card object { width:300px; height:300px; object-fit:contain; }
</style>
</head>
<body>
  <div class="card">
    <h3>ORIGINAL (JPEG)</h3>
    <img src="WhatsApp Image 2026-05-22 at 10.51.10.jpeg" />
  </div>
  <div class="card">
    <h3>MEU SVG (MANUAL)</h3>
    <img src="grupo-etarp-icon.svg" />
  </div>
  <div class="card">
    <h3>TRACE (REFERENCIA)</h3>
    <img src="grupo-etarp-icon-traced.svg" />
  </div>
</body>
</html>
