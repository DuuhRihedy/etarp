<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparação — Logo SVGs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 32px;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 32px;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header h2 { font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .badge {
      font-size: 0.6rem;
      padding: 3px 8px;
      border-radius: 16px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .b-ref { background: #1e3a5f; color: #60a5fa; }
    .b-new { background: #1e5f2e; color: #4ade80; }
    .b-alt { background: #5f4f1e; color: #fbbf24; }
    .preview {
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      background: #fff;
    }
    .preview img {
      max-width: 240px;
      max-height: 240px;
      width: 100%;
      height: auto;
    }
    .bg-toggle {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 10px;
      border-top: 1px solid #333;
    }
    .bg-toggle button {
      padding: 5px 12px;
      border: 1px solid #444;
      background: #222;
      color: #aaa;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.65rem;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .bg-toggle button:hover { background: #333; color: #fff; }
    .bg-toggle button.active { background: #2952CC; color: #fff; border-color: #2952CC; }
    .card-footer {
      padding: 10px 18px;
      border-top: 1px solid #333;
      font-size: 0.7rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Original PNG vs VTracer SVGs</h1>
  <div class="grid">
    <div class="card">
      <div class="card-header">
        <h2>Original (PNG)</h2>
        <span class="badge b-ref">Referência</span>
      </div>
      <div class="preview" id="p1">
        <img src="logo-original.png" alt="Original PNG">
      </div>
      <div class="bg-toggle">
        <button class="active" onclick="bg('p1','#fff',this)">Branco</button>
        <button onclick="bg('p1','#0f172a',this)">Escuro</button>
        <button onclick="bg('p1','#e2e8f0',this)">Cinza</button>
      </div>
      <div class="card-footer">logo-original.png — 179×196px</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>VTracer Standard</h2>
        <span class="badge b-new">70 KB</span>
      </div>
      <div class="preview" id="p2">
        <img src="etarp-logo-vtracer.svg" alt="VTracer Standard">
      </div>
      <div class="bg-toggle">
        <button class="active" onclick="bg('p2','#fff',this)">Branco</button>
        <button onclick="bg('p2','#0f172a',this)">Escuro</button>
        <button onclick="bg('p2','#e2e8f0',this)">Cinza</button>
      </div>
      <div class="card-footer">etarp-logo-vtracer.svg — Detalhado</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>VTracer Smooth</h2>
        <span class="badge b-alt">2.5 KB</span>
      </div>
      <div class="preview" id="p3">
        <img src="etarp-logo-vtracer-smooth.svg" alt="VTracer Smooth">
      </div>
      <div class="bg-toggle">
        <button class="active" onclick="bg('p3','#fff',this)">Branco</button>
        <button onclick="bg('p3','#0f172a',this)">Escuro</button>
        <button onclick="bg('p3','#e2e8f0',this)">Cinza</button>
      </div>
      <div class="card-footer">etarp-logo-vtracer-smooth.svg — Suavizado</div>
    </div>
  </div>

  <script>
    function bg(id, color, btn) {
      document.getElementById(id).style.background = color;
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
